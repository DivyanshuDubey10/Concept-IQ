version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: concept_iq_db
    environment:
      POSTGRES_USER: conceptiq
      POSTGRES_PASSWORD: conceptiq_password
      POSTGRES_DB: conceptiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
